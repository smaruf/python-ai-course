name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "ai-doc-processor/**"
  pull_request:
    paths:
      - "ai-doc-processor/**"

defaults:
  run:
    working-directory: ai-doc-processor

jobs:
  lint-and-test:
    name: Lint & Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Test (pytest)
        run: pytest

  lint-web:
    name: Lint (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ai-doc-processor/ui/web/package.json

      - name: Install web deps
        run: npm ci
        working-directory: ai-doc-processor/ui/web

      - name: Lint web
        run: npm run lint
        working-directory: ai-doc-processor/ui/web

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ai-doc-processor
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-doc-processor:latest
            ghcr.io/${{ github.repository_owner }}/ai-doc-processor:${{ github.sha }}
