[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-doc-processor"
version = "0.1.0"
description = "AI-powered document processor with ETL pipeline and streaming LLM output"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.4",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "openai>=1.30.0",
    "pypdf>=4.2.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "locust>=2.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
